<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小二乘法大對戰！ - 雙人PK賽</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=M+PLUS+Rounded+1c:wght@700;800&family=Noto+Sans+TC:wght@700;900&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Noto Sans TC', 'M PLUS Rounded 1c', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        .font-game {
            font-family: 'Fredoka', 'M PLUS Rounded 1c', cursive, sans-serif;
        }

        /* 答錯震動效果 (GPU 加速) */
        @keyframes shake {
            0%, 100% { transform: translate3d(0, 0, 0); }
            20%, 60% { transform: translate3d(-8px, 0, 0); }
            40%, 80% { transform: translate3d(8px, 0, 0); }
        }

        .shake {
            animation: shake 0.3s cubic-bezier(.36,.07,.19,.97) both;
            will-change: transform;
        }

        /* 答對縮放效果 (GPU 加速) */
        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        .pop {
            animation: pop 0.25s ease-out both;
            will-change: transform;
        }

        /* 按鈕立體效果 */
        .btn-3d {
            transition: transform 0.05s ease, box-shadow 0.05s ease;
            box-shadow: 0 5px 0 rgba(0,0,0,0.18);
        }
        .btn-3d:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 rgba(0,0,0,0.18);
        }

        .bg-pattern {
            background-color: #f8fafc;
            background-image: radial-gradient(#e2e8f0 15%, transparent 16%), radial-gradient(#e2e8f0 15%, transparent 16%);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
        }
    </style>
</head>
<body class="bg-pattern min-h-screen flex flex-col justify-between overflow-x-hidden text-slate-800">

    <!-- 頂部控制與計時列 -->
    <header class="w-full bg-white/90 backdrop-blur-md shadow-md border-b-4 border-yellow-400 p-3 sticky top-0 z-20">
        <div class="max-w-6xl mx-auto flex flex-wrap items-center justify-between gap-2">
            
            <!-- 標題與難度選單 -->
            <div class="flex items-center gap-3">
                <div class="bg-yellow-400 text-yellow-950 font-black px-3 py-1 rounded-2xl shadow text-lg flex items-center gap-2">
                    <i class="fa-solid fa-bolt text-red-500"></i>
                    <span>乘法大對戰</span>
                </div>
                <select id="rangeSelect" class="bg-slate-100 border-2 border-slate-300 rounded-xl px-3 py-1 font-bold text-slate-700 focus:outline-none focus:border-yellow-500 text-sm md:text-base">
                    <option value="all">題目範圍：1 ~ 9 全部</option>
                    <option value="2-5">題目範圍：2 ~ 5 基礎</option>
                    <option value="6-9">題目範圍：6 ~ 9 進階</option>
                </select>
            </div>

            <!-- 計時器（中央） -->
            <div class="flex items-center bg-slate-900 text-white px-6 py-1.5 rounded-full shadow-inner font-game">
                <i class="fa-solid fa-clock text-yellow-400 text-xl mr-2 animate-pulse"></i>
                <span class="text-xs text-slate-400 mr-2">剩餘時間</span>
                <span id="timer" class="text-3xl font-black text-yellow-400 tracking-wider">60</span>
                <span class="text-xs text-slate-400 ml-1">秒</span>
            </div>

            <!-- 操作按鈕 -->
            <div class="flex items-center gap-2">
                <button id="startBtn" onclick="startGame()" class="btn-3d bg-green-500 hover:bg-green-600 text-white font-black px-5 py-2 rounded-xl text-base flex items-center gap-2">
                    <i class="fa-solid fa-play"></i> 開始遊戲

                <button id="soundToggle" onclick="toggleSound()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold p-2.5 rounded-xl text-base">

        </div>

    <!-- 主對戰區域 (P1 vs P2) -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-2 sm:p-4 flex flex-col md:flex-row gap-4 justify-center items-stretch my-auto">

                    <span class="absolute top-1 left-2 text-xs text-slate-400 font-sans">J</span>

                <button onclick="checkAnswer(2, 1)" id="p2-btn-1" disabled class="p2-opt btn-3d bg-white border-2 border-red-300 hover:border-red-500 text-red-800 font-game text-2xl sm:text-3xl font-bold py-4 rounded-2xl flex flex-col items-center justify-center relative disabled:opacity-60">

    <footer class="text-center p-3 text-xs text-slate-500">

    <!-- 結算彈窗 Modal -->
    <div id="resultModal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl border-4 border-yellow-400 p-6 sm:p-8 max-w-md w-full text-center shadow-2xl transform transition-transform duration-200 scale-95 opacity-0" id="modalCard">
            <div id="winnerIcon" class="text-6xl mb-2 text-yellow-400 animate-bounce">
                <i class="fa-solid fa-trophy"></i>
            </div>

            <h2 id="winnerText" class="text-3xl font-black text-slate-800 mb-4 font-game">
                玩家 1 勝出！
            </h2>

            <div class="grid grid-cols-2 gap-3 my-6 bg-slate-50 p-4 rounded-2xl border border-slate-200">
                <div class="border-r border-slate-200 pr-2">
                    <span class="bg-blue-500 text-white font-bold text-xs px-2 py-0.5 rounded">P1 藍隊</span>
                    <div class="text-2xl font-black text-blue-600 mt-2 font-game" id="p1-final-score">0 分</div>
                    <div class="text-xs text-slate-500 mt-1">答對：<span id="p1-correct-count" class="font-bold text-slate-700">0</span> 題</div>
                    <div class="text-xs text-slate-500">正確率：<span id="p1-acc" class="font-bold text-slate-700">0%</span></div>
                </div>

                <div class="pl-2">
                    <span class="bg-red-500 text-white font-bold text-xs px-2 py-0.5 rounded">P2 紅隊</span>
                    <div class="text-2xl font-black text-red-600 mt-2 font-game" id="p2-final-score">0 分</div>
                    <div class="text-xs text-slate-500 mt-1">答對：<span id="p2-correct-count" class="font-bold text-slate-700">0</span> 題</div>
                    <div class="text-xs text-slate-500">正確率：<span id="p2-acc" class="font-bold text-slate-700">0%</span></div>
                </div>
            </div>

            <button onclick="startGame()" class="btn-3d w-full bg-yellow-400 hover:bg-yellow-500 text-yellow-950 font-black text-xl py-3.5 rounded-2xl flex items-center justify-center gap-2">
                <i class="fa-solid fa-rotate-right"></i> 再玩一次！
            </button>
        </div>
    </div>

    <!-- JavaScript 邏輯優化版 -->
    <script>
        let isPlaying = false;
        let timer = 60;
        let timerInterval = null;
        let soundEnabled = true;

        // 全局重用音訊上下文，解決記憶體洩漏
        let audioCtx = null;

        // 預留 DOM 節點快取
        const domCache = {};

        const players = {
            1: { score: 0, combo: 0, correct: 0, total: 0, currentAns: null, options: [0, 0, 0, 0], cardEl: null, scoreEl: null, comboBadgeEl: null, comboEl: null },
            2: { score: 0, combo: 0, correct: 0, total: 0, currentAns: null, options: [0, 0, 0, 0], cardEl: null, scoreEl: null, comboBadgeEl: null, comboEl: null }
        };

        // DOM 載入後快取常用節點
        window.addEventListener('DOMContentLoaded', () => {
            domCache.timer = document.getElementById('timer');
            domCache.startBtn = document.getElementById('startBtn');
            domCache.rangeSelect = document.getElementById('rangeSelect');
            domCache.resultModal = document.getElementById('resultModal');
            domCache.modalCard = document.getElementById('modalCard');
            domCache.soundIcon = document.getElementById('soundIcon');
            
            [1, 2].forEach(pId => {
                players[pId].cardEl = document.getElementById(`p${pId}-card`);
                players[pId].scoreEl = document.getElementById(`p${pId}-score`);
                players[pId].comboBadgeEl = document.getElementById(`p${pId}-combo-badge`);
                players[pId].comboEl = document.getElementById(`p${pId}-combo`);
                players[pId].questionEl = document.getElementById(`p${pId}-question`);
                players[pId].btnEls = [0, 1, 2, 3].map(i => {
                    const btn = document.getElementById(`p${pId}-btn-${i}`);
                    return { btn, valSpan: btn.querySelector('.val') };
                });
            });

            // 初始化單例 AudioContext
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (AudioCtx) audioCtx = new AudioCtx();
            } catch(e) {
                console.warn('AudioContext not supported');
            }
        });

        // 最佳化的 Web Audio 聲響生成 (自動斷開連線 & 垃圾回收)
        function playSound(type) {
            if (!soundEnabled || !audioCtx) return;
            
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const now = audioCtx.currentTime;

            if (type === 'correct') {
                const osc1 = audioCtx.createOscillator();
                const osc2 = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc1.type = 'sine';
                osc2.type = 'sine';
                osc1.frequency.setValueAtTime(523.25, now);
                osc2.frequency.setValueAtTime(783.99, now + 0.08);

                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);

                osc1.connect(gain);
                osc2.connect(gain);
                gain.connect(audioCtx.destination);

                osc1.start(now);
                osc1.stop(now + 0.08);
                osc2.start(now + 0.08);
                osc2.stop(now + 0.3);

                osc2.onended = () => {
                    osc1.disconnect();
                    osc2.disconnect();
                    gain.disconnect();
                };
            } else if (type === 'wrong') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(80, now + 0.2);

                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start(now);
                osc.stop(now + 0.25);

                osc.onended = () => {
                    osc.disconnect();
                    gain.disconnect();
                };
            } else if (type === 'tick') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, now);

                gain.gain.setValueAtTime(0.08, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start(now);
                osc.stop(now + 0.05);

                osc.onended = () => {
                    osc.disconnect();
                    gain.disconnect();
                };
            } else if (type === 'win') {
                [261.63, 329.63, 392.00, 523.25].forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.08);
                    gain.gain.setValueAtTime(0.15, now + idx * 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.2);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + idx * 0.08);
                    osc.stop(now + idx * 0.08 + 0.2);

                    osc.onended = () => {
                        osc.disconnect();
                        gain.disconnect();
                    };
                });
            }
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            domCache.soundIcon.className = soundEnabled ? 'fa-solid fa-volume-high' : 'fa-solid fa-volume-xmark text-slate-400';
        }

        function getMultiplierRange() {
            const rangeVal = domCache.rangeSelect.value;
            if (rangeVal === '2-5') return [2, 3, 4, 5];
            if (rangeVal === '6-9') return [6, 7, 8, 9];
            return [1, 2, 3, 4, 5, 6, 7, 8, 9];
        }

        // 高效題目生成器（避免無窮迴圈與過多陣列 allocate）
        function generateQuestion(pId) {
            const range = getMultiplierRange();
            const a = range[Math.floor(Math.random() * range.length)];
            const b = Math.floor(Math.random() * 9) + 1;
            const answer = a * b;

            const p = players[pId];
            p.currentAns = answer;

            // 定向計算干擾項，保證必然不重複且極速
            const opts = [answer];
            const offsets = [-2, -1, 1, 2, 3, -3, 4, -4];
            let offsetIdx = Math.floor(Math.random() * offsets.length);

            while (opts.length < 4) {
                let wrongVal = answer + offsets[offsetIdx % offsets.length] * (Math.random() < 0.5 ? 1 : a);
                if (wrongVal <= 0 || opts.includes(wrongVal)) {
                    wrongVal = answer + (opts.length * 2) + 1;
                }
                if (!opts.includes(wrongVal)) {
                    opts.push(wrongVal);
                }
                offsetIdx++;
            }

            // 洗牌算法 (Fisher-Yates)
            for (let i = opts.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                const temp = opts[i];
                opts[i] = opts[j];
                opts[j] = temp;
            }

            p.options = opts;

            // DOM 更新
            p.questionEl.textContent = `${a} × ${b} = ?`;
            for (let i = 0; i < 4; i++) {
                p.btnEls[i].valSpan.textContent = opts[i];
                p.btnEls[i].btn.disabled = !isPlaying;
            }
        }

        // 防抖卡片動畫觸發器
        function triggerAnimation(cardEl, animClass, duration) {
            cardEl.classList.remove('pop', 'shake');
            // 強迫流覽器 reflow 觸發動畫重置
            void cardEl.offsetWidth;
            cardEl.classList.add(animClass);
            setTimeout(() => {
                cardEl.classList.remove(animClass);
            }, duration);
        }

        function checkAnswer(pId, optionIndex) {
            if (!isPlaying) return;

            const p = players[pId];
            const selectedVal = p.options[optionIndex];

            p.total++;

            if (selectedVal === p.currentAns) {
                playSound('correct');
                p.correct++;
                p.combo++;
                
                const comboBonus = Math.min((p.combo - 1) * 2, 10);
                p.score += (10 + Math.max(0, comboBonus));

                triggerAnimation(p.cardEl, 'pop', 250);
            } else {
                playSound('wrong');
                p.combo = 0;
                p.score = Math.max(0, p.score - 2);

                triggerAnimation(p.cardEl, 'shake', 300);
            }

            // 更新介面
            p.scoreEl.textContent = p.score;
            if (p.combo >= 2) {
                p.comboBadgeEl.classList.remove('hidden');
                p.comboEl.textContent = p.combo;
            } else {
                p.comboBadgeEl.classList.add('hidden');
            }

            generateQuestion(pId);
        }

        // 鍵盤監聽，加入 repeat 鎖避免長按連續觸發
        document.addEventListener('keydown', (e) => {
            if (!isPlaying || e.repeat) return;

            const key = e.key.toLowerCase();
            if (key === 'a') checkAnswer(1, 0);
            else if (key === 's') checkAnswer(1, 1);
            else if (key === 'd') checkAnswer(1, 2);
            else if (key === 'f') checkAnswer(1, 3);
            else if (key === 'j') checkAnswer(2, 0);
            else if (key === 'k') checkAnswer(2, 1);
            else if (key === 'l') checkAnswer(2, 2);
            else if (key === ';' || key === ':') checkAnswer(2, 3);
        });

        function startGame() {
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            // 確保先清除舊的計時器，防止計時加速與疊加
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }

            isPlaying = true;
            timer = 60;
            
            [1, 2].forEach(pId => {
                const p = players[pId];
                p.score = 0;
                p.combo = 0;
                p.correct = 0;
                p.total = 0;
                p.scoreEl.textContent = '0';
                p.comboBadgeEl.classList.add('hidden');
            });

            domCache.timer.textContent = timer;
            domCache.startBtn.innerHTML = `<i class="fa-solid fa-rotate-right"></i> 重新開始`;
            
            hideResultModal();

            generateQuestion(1);
            generateQuestion(2);

            timerInterval = setInterval(() => {
                timer--;
                domCache.timer.textContent = timer;

                if (timer <= 5 && timer > 0) {
                    playSound('tick');
                }

                if (timer <= 0) {
                    endGame();
                }
            }, 1000);
        }

        function endGame() {
            isPlaying = false;
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            playSound('win');

            [1, 2].forEach(pId => {
                players[pId].btnEls.forEach(item => item.btn.disabled = true);
            });

            const p1 = players[1];
            const p2 = players[2];

            let winnerText = '';
            let winnerIcon = '<i class="fa-solid fa-trophy"></i>';

            if (p1.score > p2.score) {
                winnerText = '🎉 藍隊 (P1) 獲得勝利！';
            } else if (p2.score > p1.score) {
                winnerText = '🎉 紅隊 (P2) 獲得勝利！';
            } else {
                winnerText = '🤝 勢均力敵，不分勝負！';
                winnerIcon = '<i class="fa-solid fa-handshake"></i>';
            }

            document.getElementById('winnerText').textContent = winnerText;
            document.getElementById('winnerIcon').innerHTML = winnerIcon;

            document.getElementById('p1-final-score').textContent = `${p1.score} 分`;
            document.getElementById('p1-correct-count').textContent = p1.correct;
            document.getElementById('p1-acc').textContent = p1.total > 0 ? `${Math.round((p1.correct / p1.total) * 100)}%` : '0%';

            document.getElementById('p2-final-score').textContent = `${p2.score} 分`;
            document.getElementById('p2-correct-count').textContent = p2.correct;
            document.getElementById('p2-acc').textContent = p2.total > 0 ? `${Math.round((p2.correct / p2.total) * 100)}%` : '0%';

            showResultModal();
        }

        function showResultModal() {
            domCache.resultModal.classList.remove('hidden');
            requestAnimationFrame(() => {
                domCache.modalCard.classList.remove('scale-95', 'opacity-0');
                domCache.modalCard.classList.add('scale-100', 'opacity-100');
            });
        }

        function hideResultModal() {
            domCache.modalCard.classList.remove('scale-100', 'opacity-100');
            domCache.modalCard.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                domCache.resultModal.classList.add('hidden');
            }, 150);
        }
    </script>
</body>
</html>
